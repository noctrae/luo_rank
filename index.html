<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造梦师S3巅峰赛｜羅 全自動看板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --target-bg: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 20px 12px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .status-bar {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .anchor-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .anchor-card.target {
            background-color: var(--target-bg);
            border-color: #60a5fa;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .rank-badge {
            font-size: 1.1rem;
            font-weight: bold;
            width: 70px;
            color: var(--text-secondary);
        }

        .anchor-card.target .rank-badge {
            color: #ffffff;
        }

        .info-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .nick-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .score-val {
            font-size: 1.1rem;
            font-weight: bold;
            font-family: monospace;
        }

        .diff-tag {
            font-size: 0.8rem;
            text-align: right;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .diff-tag.ahead {
            color: #fca5a5;
            background-color: rgba(239, 68, 68, 0.15);
        }

        .diff-tag.behind {
            color: #86efac;
            background-color: rgba(34, 197, 94, 0.15);
        }

        .footer-info {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .error-msg {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>造梦师S3巅峰赛｜羅</h1>
        <div class="status-bar">
            <span>最后更新: <span id="last-update">--:--:--</span></span>
            <span>下次更新: <span id="next-update">60</span>s</span>
        </div>
    </header>

    <div id="error-box" class="error-msg"></div>

    <main id="rank-container" class="card-list">
        <div class="loading">正在获取最新数据...</div>
    </main>

    <div class="footer-info">
        <span id="total-count">共 -- 名</span> | 自动刷新间隔: 30 秒
    </div>
</div>

<script>
    // 基础配置
    const CONFIG = {
        TARGET_NAME: "羅",       // 目标主播名字（完全匹配）
        REFRESH_INTERVAL: 30,   // 刷新周期（秒）
        API_URL: "https://webcast.amemv.com/magic/api/v4/MjQxNzU2NjE0NDIy/ranklist/MjQxNzU2NjE0NDMy/list?page_num=1&page_size=50&contributor_count=3&guest_count=1&aid=1128",
        // 跨域备用 Proxy（当原生 fetch 被 CORS 封锁时触发）
        CORS_PROXY: "https://api.allorigins.win/raw?url="
    };

    let countdown = CONFIG.REFRESH_INTERVAL;
    let timer = null;
    let useProxy = false; // 是否触发了 CORS 并开启 Proxy

    // 格式化数字（千分位，保留 2 位小数）
    function formatScore(num) {
        return Number(num).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    // 格式化时间
    function getNowTimeString() {
        const d = new Date();
        return d.toTimeString().split(' ')[0];
    }

    // 显示错误消息
    function showError(msg) {
        const errBox = document.getElementById("error-box");
        errBox.innerText = msg;
        errBox.style.display = "block";
    }

    // 隐藏错误消息
    function clearError() {
        const errBox = document.getElementById("error-box");
        errBox.innerText = "";
        errBox.style.display = "none";
    }

    // 请求 API 並解析雙層 JSON
    async function fetchRankList() {
        let requestUrl = useProxy ? CONFIG.CORS_PROXY + encodeURIComponent(CONFIG.API_URL) : CONFIG.API_URL;
        
        try {
            const response = await fetch(requestUrl);
            if (!response.ok) {
                throw new Error(`HTTP 错误！状态码: ${response.status}`);
            }

            const outer = await response.json();
            
            // 第一次 Parse 后，data 可能是 JSON 字符串，需二次 Parse
            let data = outer.data;
            if (typeof data === "string") {
                data = JSON.parse(data);
            }

            if (!data || !data.rank_list) {
                throw new Error("API 返回结构不符合预期");
            }

            return data;
        } catch (err) {
            // 如果尚未开启代理且遇到 Fetch 失败，判定可能为 CORS 错误，自动升降级
            if (!useProxy && (err.name === 'TypeError' || err.message.includes('Failed to fetch'))) {
                console.warn("检测到可能存在 CORS 跨域限制，正在切换至 CORS 代理服务器...");
                useProxy = true;
                return await fetchRankList(); // 重新请求
            }
            throw err;
        }
    }

    // 核心渲染逻辑（已增强主播匹配逻辑，兼容繁简体与包含匹配）
    async function updateDashboard() {
        try {
            const data = await fetchRankList();
            clearError();

            const rankList = data.rank_list || [];
            const totalCount = rankList.length;
            const hasMore = data.has_more;

            document.getElementById("total-count").innerText = `共 ${totalCount}${hasMore ? '+' : ''} 名`;

            // 定义目标查找关键字（包含繁体“羅”与简体“罗”）
            const targetKeywords = [CONFIG.TARGET_NAME, "羅", "罗"];

            // 1. 优先尝试：完全匹配（精确匹配 羅 或 罗）
            let targetIndex = rankList.findIndex(item => {
                const nick = item.rank_info?.element_info?.nick_name || "";
                return targetKeywords.some(kw => nick.trim() === kw);
            });

            // 2. 备选尝试：如果完全匹配找不到，使用包含匹配（includes）
            if (targetIndex === -1) {
                targetIndex = rankList.findIndex(item => {
                    const nick = item.rank_info?.element_info?.nick_name || "";
                    return targetKeywords.some(kw => nick.includes(kw));
                });
            }

            const container = document.getElementById("rank-container");
            container.innerHTML = "";

            if (targetIndex === -1) {
                container.innerHTML = `<div class="loading">未在榜单前 ${totalCount} 名中找到包含“${CONFIG.TARGET_NAME}”的主播</div>`;
                return;
            }

            const targetItem = rankList[targetIndex];
            // 取得 API 中主播实际的真实昵称（例如：罗）
            const realTargetName = targetItem.rank_info.element_info.nick_name;
            const targetScore = Number(targetItem.rank_info.score || 0);

            // 安全计算前 2 名和后 2 名（避免数组越界）
            const startIndex = Math.max(0, targetIndex - 2);
            const endIndex = Math.min(rankList.length - 1, targetIndex + 2);

            const displayList = rankList.slice(startIndex, endIndex + 1);

            displayList.forEach(item => {
                const rank = item.rank_info.rank;
                const name = item.rank_info.element_info.nick_name;
                const score = Number(item.rank_info.score || 0);
                const isTarget = (item === targetItem); // 以物件引用判断是否为目标主播

                const card = document.createElement("div");
                card.className = `anchor-card ${isTarget ? 'target' : ''}`;

                let diffHtml = "";
                if (!isTarget) {
                    if (score > targetScore) {
                        const diff = score - targetScore;
                        diffHtml = `<div class="diff-tag ahead">领先 ${realTargetName} ${formatScore(diff)}</div>`;
                    } else {
                        const diff = targetScore - score;
                        diffHtml = `<div class="diff-tag behind">落后 ${realTargetName} ${formatScore(diff)}</div>`;
                    }
                } else {
                    diffHtml = `<div class="diff-tag" style="color: #ffffff; background: rgba(255,255,255,0.2);">监测中</div>`;
                }

                card.innerHTML = `
                    <div class="rank-badge">第 ${rank} 名</div>
                    <div class="info-section">
                        <div class="nick-name">${name}</div>
                        <div class="score-val">${formatScore(score)}</div>
                    </div>
                    ${diffHtml}
                `;

                container.appendChild(card);
            });

            document.getElementById("last-update").innerText = getNowTimeString();

        } catch (err) {
            console.error(err);
            showError(`数据获取失败: ${err.message}。如果持续失败，代表需要部署 CORS 云函数代理。`);
        }
    }
    // 倒计时控制
    function startTimer() {
        countdown = CONFIG.REFRESH_INTERVAL;
        document.getElementById("next-update").innerText = countdown;

        if (timer) clearInterval(timer);

        timer = setInterval(() => {
            countdown--;
            document.getElementById("next-update").innerText = countdown;

            if (countdown <= 0) {
                updateDashboard();
                countdown = CONFIG.REFRESH_INTERVAL;
            }
        }, 1000);
    }

    // 初始化运行
    function init() {
        updateDashboard();
        startTimer();
    }

    window.onload = init;
</script>
</body>
</html>
