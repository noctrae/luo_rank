<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造梦师S3巅峰赛｜羅 全自动看板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --target-bg: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 16px 12px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 顶部主看板 */
        .dashboard-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid var(--target-bg);
            border-radius: 16px;
            padding: 18px 16px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
            text-align: center;
        }

        .dash-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .dash-target-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dash-rank-badge {
            background-color: var(--target-bg);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .dash-score {
            font-size: 2.1rem;
            font-weight: 800;
            font-family: monospace;
            color: #60a5fa;
            margin: 6px 0;
        }

        .dash-delta {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .delta-up { color: #86efac; }
        .delta-down { color: #fca5a5; }
        .delta-zero { color: var(--text-secondary); }

        /* 左右差距对比区（上一名 | 下一名） */
        .dash-diff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .diff-box {
            background-color: rgba(255, 255, 255, 0.04);
            padding: 8px 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .diff-box .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .diff-box .val {
            font-size: 0.95rem;
            font-weight: bold;
            font-family: monospace;
        }

        .diff-box .delta-sub {
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 2px;
        }

        .status-bar {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .anchor-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .anchor-card.target {
            background-color: var(--target-bg);
            border-color: #60a5fa;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .rank-badge {
            font-size: 1.1rem;
            font-weight: bold;
            width: 70px;
            color: var(--text-secondary);
        }

        .anchor-card.target .rank-badge {
            color: #ffffff;
        }

        .info-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .nick-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .score-val {
            font-size: 1.1rem;
            font-weight: bold;
            font-family: monospace;
        }

        .diff-tag {
            font-size: 0.8rem;
            text-align: right;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .diff-tag.ahead {
            color: #fca5a5;
            background-color: rgba(239, 68, 68, 0.15);
        }

        .diff-tag.behind {
            color: #86efac;
            background-color: rgba(34, 197, 94, 0.15);
        }

        .footer-info {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .error-msg {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-bar">
        <span>最后更新: <span id="last-update">--:--:--</span></span>
        <span>下次更新: <span id="next-update">5</span>s</span>
    </div>

    <!-- 顶部主看板 -->
    <header id="main-dashboard" class="dashboard-header">
        <div class="dash-title">造梦师S3巅峰赛｜实时监视</div>
        <div class="dash-target-name">
            <span id="dash-name">羅</span>
            <span id="dash-rank" class="dash-rank-badge">第 -- 名</span>
        </div>
        <div id="dash-score" class="dash-score">0.00</div>
        <div id="dash-delta" class="dash-delta delta-zero">涨幅: -- (较上次)</div>

        <!-- 左右对比区：上一名 (差距+对方涨幅) | 下一名 (差距+对方涨幅) -->
        <div class="dash-diff-grid">
            <div class="diff-box">
                <span class="label" id="prev-label">距上一名</span>
                <span class="val" id="prev-val" style="color: #fca5a5;">--</span>
                <span class="delta-sub delta-zero" id="prev-delta">对方涨幅: --</span>
            </div>
            <div class="diff-box">
                <span class="label" id="next-label">领先下一名</span>
                <span class="val" id="next-val" style="color: #86efac;">--</span>
                <span class="delta-sub delta-zero" id="next-delta">对方涨幅: --</span>
            </div>
        </div>
    </header>

    <div id="error-box" class="error-msg"></div>

    <main id="rank-container" class="card-list">
        <div class="loading">正在获取最新数据...</div>
    </main>

    <div class="footer-info">
        <span id="total-count">共 -- 名</span> | 自动刷新间隔: 5 秒
    </div>
</div>

<script>
    // 基础配置
    const CONFIG = {
        TARGET_NAME: "羅",       // 目标主播名字（完全匹配）
        REFRESH_INTERVAL: 5,   // 刷新周期（秒）
        API_URL: "https://webcast.amemv.com/magic/api/v4/MjQxNzU2ODIxMjgx/ranklist/MjQxNzU2ODIxMjkw/list?page_num=1&page_size=50&contributor_count=3&guest_count=1&aid=1128",
        CORS_PROXY: "https://api.allorigins.win/raw?url="
    };

    let countdown = CONFIG.REFRESH_INTERVAL;
    let timer = null;
    let useProxy = false;

    // 记录上一轮所有主播的分数以计算涨幅 (Key: 主播昵称, Value: 分数)
    const previousScores = new Map();

    function formatScore(num) {
        return Number(num).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function getNowTimeString() {
        const d = new Date();
        return d.toTimeString().split(' ')[0];
    }

    function showError(msg) {
        const errBox = document.getElementById("error-box");
        errBox.innerText = msg;
        errBox.style.display = "block";
    }

    function clearError() {
        const errBox = document.getElementById("error-box");
        errBox.innerText = "";
        errBox.style.display = "none";
    }

    async function fetchRankList() {
        let requestUrl = useProxy ? CONFIG.CORS_PROXY + encodeURIComponent(CONFIG.API_URL) : CONFIG.API_URL;
        
        try {
            const response = await fetch(requestUrl);
            if (!response.ok) {
                throw new Error(`HTTP 错误！状态码: ${response.status}`);
            }

            const outer = await response.json();
            let data = outer.data;
            if (typeof data === "string") {
                data = JSON.parse(data);
            }

            if (!data || !data.rank_list) {
                throw new Error("API 返回结构不符合预期");
            }

            return data;
        } catch (err) {
            if (!useProxy && (err.name === 'TypeError' || err.message.includes('Failed to fetch'))) {
                console.warn("检测到可能存在 CORS 跨域限制，正在切换至 CORS 代理服务器...");
                useProxy = true;
                return await fetchRankList();
            }
            throw err;
        }
    }

    // 计算单个主播的涨幅文本和 CSS 类名
    function getDeltaInfo(anchorName, currentScore) {
        if (!previousScores.has(anchorName)) {
            return { text: "对方涨幅: 首次载入", class: "delta-zero" };
        }
        const lastScore = previousScores.get(anchorName);
        const delta = currentScore - lastScore;
        if (delta > 0) {
            return { text: `对方涨幅 +${formatScore(delta)}`, class: "delta-up" };
        } else if (delta < 0) {
            return { text: `对方跌幅 -${formatScore(Math.abs(delta))}`, class: "delta-down" };
        } else {
            return { text: `对方涨幅 +0.00`, class: "delta-zero" };
        }
    }

    async function updateDashboard() {
        try {
            const data = await fetchRankList();
            clearError();

            const rankList = data.rank_list || [];
            const totalCount = rankList.length;
            const hasMore = data.has_more;

            document.getElementById("total-count").innerText = `共 ${totalCount}${hasMore ? '+' : ''} 名`;

            const targetKeywords = [CONFIG.TARGET_NAME, "羅", "罗"];

            // 查找目标主播
            let targetIndex = rankList.findIndex(item => {
                const nick = item.rank_info?.element_info?.nick_name || "";
                return targetKeywords.some(kw => nick.trim() === kw);
            });

            if (targetIndex === -1) {
                targetIndex = rankList.findIndex(item => {
                    const nick = item.rank_info?.element_info?.nick_name || "";
                    return targetKeywords.some(kw => kw.length > 0 && nick.includes(kw));
                });
            }

            const container = document.getElementById("rank-container");
            container.innerHTML = "";

            if (targetIndex === -1) {
                container.innerHTML = `<div class="loading">未在榜单前 ${totalCount} 名中找到包含“${CONFIG.TARGET_NAME}”的主播</div>`;
                return;
            }

            const targetItem = rankList[targetIndex];
            const realTargetName = targetItem.rank_info.element_info.nick_name;
            const targetRank = targetItem.rank_info.rank;
            const targetScore = Number(targetItem.rank_info.score || 0);

            // --- 1. 更新顶部主看板（目标主播“羅”） ---
            document.getElementById("dash-name").innerText = realTargetName;
            document.getElementById("dash-rank").innerText = `第 ${targetRank} 名`;
            document.getElementById("dash-score").innerText = formatScore(targetScore);

            const deltaEl = document.getElementById("dash-delta");
            if (previousScores.has(realTargetName)) {
                const delta = targetScore - previousScores.get(realTargetName);
                if (delta > 0) {
                    deltaEl.className = "dash-delta delta-up";
                    deltaEl.innerText = `涨幅 +${formatScore(delta)} (较上次)`;
                } else if (delta < 0) {
                    deltaEl.className = "dash-delta delta-down";
                    deltaEl.innerText = `跌幅 -${formatScore(Math.abs(delta))} (较上次)`;
                } else {
                    deltaEl.className = "dash-delta delta-zero";
                    deltaEl.innerText = `涨幅 +0.00 (无变化)`;
                }
            } else {
                deltaEl.className = "dash-delta delta-zero";
                deltaEl.innerText = `涨幅 首次载入`;
            }

            // --- 2. 更新上一名与下一名的差距和对方涨幅 ---
            const prevItem = rankList[targetIndex - 1];
            const nextItem = rankList[targetIndex + 1];

            // 上一名
            const prevDeltaEl = document.getElementById("prev-delta");
            if (prevItem) {
                const prevName = prevItem.rank_info.element_info.nick_name;
                const prevScore = Number(prevItem.rank_info.score || 0);
                const prevRank = prevItem.rank_info.rank;

                document.getElementById("prev-label").innerText = `距上一名 (第${prevRank}名)`;
                document.getElementById("prev-val").innerText = `-${formatScore(prevScore - targetScore)}`;

                const prevInfo = getDeltaInfo(prevName, prevScore);
                prevDeltaEl.innerText = prevInfo.text;
                prevDeltaEl.className = `delta-sub ${prevInfo.class}`;
            } else {
                document.getElementById("prev-label").innerText = `距上一名`;
                document.getElementById("prev-val").innerText = `已经是第一名`;
                prevDeltaEl.innerText = `对方涨幅: --`;
                prevDeltaEl.className = `delta-sub delta-zero`;
            }

            // 下一名
            const nextDeltaEl = document.getElementById("next-delta");
            if (nextItem) {
                const nextName = nextItem.rank_info.element_info.nick_name;
                const nextScore = Number(nextItem.rank_info.score || 0);
                const nextRank = nextItem.rank_info.rank;

                document.getElementById("next-label").innerText = `领先下一名 (第${nextRank}名)`;
                document.getElementById("next-val").innerText = `+${formatScore(targetScore - nextScore)}`;

                const nextInfo = getDeltaInfo(nextName, nextScore);
                nextDeltaEl.innerText = nextInfo.text;
                nextDeltaEl.className = `delta-sub ${nextInfo.class}`;
            } else {
                document.getElementById("next-label").innerText = `领先下一名`;
                document.getElementById("next-val").innerText = `已在榜底`;
                nextDeltaEl.innerText = `对方涨幅: --`;
                nextDeltaEl.className = `delta-sub delta-zero`;
            }

            // --- 3. 保存本轮所有主播的分数（为下一次 5 秒刷新算涨幅） ---
            rankList.forEach(item => {
                const name = item.rank_info?.element_info?.nick_name;
                const score = Number(item.rank_info?.score || 0);
                if (name) previousScores.set(name, score);
            });

            // --- 4. 渲染下方卡片列表（显示前后各 5 名） ---
            const range = 5; 
            const startIndex = Math.max(0, targetIndex - range);
            const endIndex = Math.min(rankList.length - 1, targetIndex + range);

            const displayList = rankList.slice(startIndex, endIndex + 1);

            displayList.forEach(item => {
                const rank = item.rank_info.rank;
                const name = item.rank_info.element_info.nick_name;
                const score = Number(item.rank_info.score || 0);
                const isTarget = (item === targetItem);

                const card = document.createElement("div");
                card.className = `anchor-card ${isTarget ? 'target' : ''}`;

                let diffHtml = "";
                if (!isTarget) {
                    if (score > targetScore) {
                        const diff = score - targetScore;
                        diffHtml = `<div class="diff-tag ahead">领先 ${realTargetName} ${formatScore(diff)}</div>`;
                    } else {
                        const diff = targetScore - score;
                        diffHtml = `<div class="diff-tag behind">落后 ${realTargetName} ${formatScore(diff)}</div>`;
                    }
                } else {
                    diffHtml = `<div class="diff-tag" style="color: #ffffff; background: rgba(255,255,255,0.2);">监测中</div>`;
                }

                card.innerHTML = `
                    <div class="rank-badge">第 ${rank} 名</div>
                    <div class="info-section">
                        <div class="nick-name">${name}</div>
                        <div class="score-val">${formatScore(score)}</div>
                    </div>
                    ${diffHtml}
                `;

                container.appendChild(card);
            });

            document.getElementById("last-update").innerText = getNowTimeString();

        } catch (err) {
            console.error(err);
            showError(`数据获取失败: ${err.message}。如果持续失败，代表需要部署 CORS 云函数代理。`);
        }
    }

    function startTimer() {
        countdown = CONFIG.REFRESH_INTERVAL;
        document.getElementById("next-update").innerText = countdown;

        if (timer) clearInterval(timer);

        timer = setInterval(() => {
            countdown--;
            document.getElementById("next-update").innerText = countdown;

            if (countdown <= 0) {
                updateDashboard();
                countdown = CONFIG.REFRESH_INTERVAL;
            }
        }, 1000);
    }

    function init() {
        updateDashboard();
        startTimer();
    }

    window.onload = init;
</script>
</body>
</html>
